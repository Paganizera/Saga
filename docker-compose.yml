services:
  saga:
    container_name: saga
    build:
      context: src
      dockerfile: Dockerfile
    ports:
      - "${SAGA_LOCAL_PORT:-8090}:${SAGA_PORT:-8090}"
    env_file:
      - .env
    environment:
      DATABASE_HOST: database
    depends_on:
      database:
        condition: service_healthy
    networks:
      - default

  database:
    image: postgres:bullseye
    hostname: saga-db
    ports:
      - "${DATABASE_LOCAL_PORT:-5432}:5432"
    volumes:
      - saga-postgres-data:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

volumes:
  saga-postgres-data:
    name: saga-postgres-data

networks:
    default:
        name: saga-network